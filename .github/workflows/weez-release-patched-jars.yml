name: "Weez: release patched Debezium jars"

# Builds the Weezevent-patched Debezium jars (debezium-connector-common and
# debezium-connector-postgres) and publishes them as a GitHub Release. The
# kafka-connect image (argocd-applications) downloads these two jars and
# overwrites the stock jars that ship inside the official
# debezium-connector-postgres plugin tarball.
#
# Triggers:
#   - push to weez-3.7 (i.e. a merged PR): the release tag is read from
#     .weez-release. If that release already exists, nothing is published, so
#     bump .weez-release in the PR to ship a new version.
#   - manual run: release_tag input (defaults to .weez-release); an existing
#     release gets its assets replaced.

on:
  push:
    branches:
      - weez-3.7
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (empty = value of .weez-release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weez-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: "Build & release patched jars"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="$(tr -d '[:space:]' < .weez-release)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag (empty input and .weez-release)"
            exit 1
          fi
          exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "Release $tag already exists: nothing to publish (bump .weez-release to ship a new version)."
          fi

      - name: Set up JDK 21
        if: github.event_name == 'workflow_dispatch' || steps.tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build patched modules
        if: github.event_name == 'workflow_dispatch' || steps.tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ./mvnw -B -ntp clean install \
            -pl debezium-connector-common,debezium-connector-postgres -am -Dquick

      - name: Collect patched jars
        if: github.event_name == 'workflow_dispatch' || steps.tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist
          common_jar="$(ls debezium-connector-common/target/debezium-connector-common-*.Final.jar | grep -vE 'sources|javadoc|tests|original' | head -1)"
          pg_jar="$(ls debezium-connector-postgres/target/debezium-connector-postgres-*.Final.jar | grep -vE 'sources|javadoc|tests|original' | head -1)"
          test -f "$common_jar"
          test -f "$pg_jar"
          # sanity check: the jars must contain the Weezevent patch
          unzip -l "$common_jar" | grep -q 'io/debezium/relational/SchemaTemplate.class'
          cp "$common_jar" "$pg_jar" dist/
          ( cd dist && sha256sum *.jar > SHA256SUMS.txt )
          ls -l dist/
          cat dist/SHA256SUMS.txt

      - name: Create / update release
        if: github.event_name == 'workflow_dispatch' || steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="Weezevent-patched Debezium jars built from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::12}\` (upstream base v3.7.0.Final).

          Replaces the stock \`debezium-connector-common\` and \`debezium-connector-postgres\` jars inside the official plugin tarball.

          See WEEZEVENT_FORK.md for the branch model and how the kafka-connect image consumes these assets."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.jar dist/SHA256SUMS.txt \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes "$notes"
          fi
